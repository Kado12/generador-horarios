version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: horarios_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: generador_horarios
    ports:
      - "3308:3306"
    volumes:
      - horarios_data:/var/lib/mysql
volumes:
  horarios_data: